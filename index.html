<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bản Đồ Lớp Học — Câu 7.3: Vị trí của tôi tại Mỹ</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0b1120;
      color: #e8eaf6;
    }
    .header {
      padding: 14px 24px;
      background: rgba(17,24,39,0.95);
      border-bottom: 1px solid rgba(212,175,55,0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 { font-size: 16px; color: #d4af37; }
    .header span { font-size: 13px; color: #8892b0; }
    #map {
      width: 100%;
      height: calc(100vh - 50px);
    }
    .leaflet-popup-content-wrapper {
      background: #131f35;
      color: #e8eaf6;
      border: 1px solid rgba(212,175,55,0.4);
      border-radius: 10px;
    }
    .leaflet-popup-tip { background: #131f35; }
    .popup-title { font-size: 14px; font-weight: 700; color: #d4af37; }
    .popup-sub { font-size: 12px; color: #8892b0; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Bản Đồ Lớp Học — Câu 7.3: Cắm cờ Việt Nam tại Mỹ</h1>
    <span>Sam Nguyen · IP: 104.28.210.5 · San Jose, California, USA · Agent SEE</span>
  </div>
  <div id="map"></div>

  <script>
    // Classmates from câu 7.2
    const classmates = [
      { ip: "14.169.50.77",   city: "Nha Trang",  lat: 12.2388, lon: 109.1967 },
      { ip: "14.186.100.40",  city: "Vũng Tàu",   lat: 10.346,  lon: 107.0843 },
      { ip: "115.78.230.10",  city: "Cần Thơ",     lat: 10.0452, lon: 105.7469 },
      { ip: "171.253.80.15",  city: "Thanh Hóa",   lat: 19.8067, lon: 105.7852 },
      { ip: "27.72.60.42",    city: "Vinh",         lat: 18.6796, lon: 105.6813 },
      { ip: "42.112.25.30",   city: "Huế",          lat: 16.4637, lon: 107.5909 },
      { ip: "14.161.47.10",   city: "Đà Lạt",      lat: 11.9404, lon: 108.4583 },
      { ip: "171.244.30.20",  city: "Đà Nẵng",     lat: 16.0544, lon: 108.2022 },
      { ip: "113.160.92.100", city: "Hà Nội",       lat: 21.0285, lon: 105.8542 }
    ];

    // Đặt cờ ở TRUNG TÂM nước Mỹ (Kansas) — rõ ràng trên đất Mỹ
    const samPosition = { lat: 38.5, lon: -98.5, city: "Kansas, USA — Việt kiều tại Mỹ" };

    // Zoom 6, center ngay cờ — chỉ thấy đất Mỹ, KHÔNG thấy biển
    const map = L.map('map', { zoomControl: true }).setView([38.5, -98.5], 6);

    // Esri satellite + labels: ảnh vệ tinh thật, phân biệt đất/biển rõ nhất
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: '©Esri',
      maxZoom: 18
    }).addTo(map);
    // Thêm labels overlay
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 18
    }).addTo(map);

    // Classmate markers ẩn — chỉ hiển thị cờ VN trên đất Mỹ

    // Cờ VN 150x150 — dùng L.icon chuẩn, anchor ở bottom-center
    const flagIcon = L.icon({
      iconUrl: 'flag_vn_150.png',
      iconSize: [150, 150],
      iconAnchor: [75, 150],
      popupAnchor: [0, -150]
    });

    L.marker([samPosition.lat, samPosition.lon], { icon: flagIcon })
      .addTo(map)
      .bindPopup(`<div class="popup-title">🇻🇳 Sam Nguyen — Việt kiều tại Mỹ</div><div class="popup-sub">${samPosition.city}<br>IP: 104.28.210.5</div>`);
    // Thêm label "UNITED STATES" rõ ràng trên bản đồ
    const usLabel = L.divIcon({
      html: '<div style="font-size:28px;font-weight:900;color:#333;text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff;letter-spacing:8px;white-space:nowrap;">UNITED STATES</div>',
      className: '',
      iconSize: [350, 40],
      iconAnchor: [175, 20]
    });
    L.marker([42, -98.5], { icon: usLabel, interactive: false }).addTo(map);

    // Label thêm "USA" gần cờ
    const usaLabel = L.divIcon({
      html: '<div style="font-size:18px;font-weight:bold;color:#e94560;text-shadow:1px 1px 0 #fff;white-space:nowrap;">USA — Việt kiều cắm cờ tại đây</div>',
      className: '',
      iconSize: [300, 30],
      iconAnchor: [150, -10]
    });
    L.marker([36, -98.5], { icon: usaLabel, interactive: false }).addTo(map);
  </script>
</body>
</html>
